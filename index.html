<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>RER C - Live (plan schématique)</title>
<style>
  body { background: #14151a; margin: 0; font-family: "Helvetica Neue", Arial, sans-serif; }
  svg { width: 100%; height: 100vh; }
  .segment { stroke: #FFCE00; stroke-width: 5; fill: none; stroke-linecap: round; }
  .station { fill: #14151a; stroke: #FFCE00; stroke-width: 2; }
  .station-hub { fill: #14151a; stroke: #fff; stroke-width: 2.5; r: 5; }
  .station-label { fill: #ddd; font-size: 7.5px; }
  .train {
    fill: #25303B;
    stroke: #FFCE00;
    stroke-width: 2.5;
    transition: cx 3s linear, cy 3s linear;
  }
  .badge {
    position: fixed; top: 16px; left: 16px;
    background: #FFCE00; color: #25303B; font-weight: bold;
    width: 34px; height: 34px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; font-family: Arial, sans-serif;
  }
</style>
</head>
<body>
<div class="badge">C</div>
<svg id="map" viewBox="-19 -16 46 34"></svg>

<script>
const HUBS = new Set(["Javel","Champ de Mars - Tour Eiffel","Choisy-le-Roi","Juvisy","Massy-Palaiseau",
                       "Viroflay Rive Gauche","Versailles-Chantiers","Brétigny","Saint-Michel Notre-Dame",
                       "Paris Austerlitz"]);

async function loadSchema() {
  const res = await fetch("rer_c_schema.json");
  return res.json();
}

function drawSchema(svg, schema) {
  const { stations, segments, line_color } = schema;

  segments.forEach(([a, b]) => {
    const p1 = stations[a], p2 = stations[b];
    if (!p1 || !p2) return;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", p1.x); line.setAttribute("y1", p1.y);
    line.setAttribute("x2", p2.x); line.setAttribute("y2", p2.y);
    line.setAttribute("class", "segment");
    if (line_color) line.setAttribute("stroke", line_color);
    svg.appendChild(line);
  });

  Object.entries(stations).forEach(([name, p]) => {
    const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
    circle.setAttribute("cx", p.x); circle.setAttribute("cy", p.y);
    circle.setAttribute("r", HUBS.has(name) ? 0.28 : 0.14);
    circle.setAttribute("class", "station");
    svg.appendChild(circle);

    if (HUBS.has(name)) {
      const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
      label.setAttribute("x", p.x + 0.35); label.setAttribute("y", p.y - 0.35);
      label.setAttribute("class", "station-label");
      label.textContent = name;
      svg.appendChild(label);
    }
  });
}

const trainElements = new Map();

function updateTrains(svg, trains) {
  const seen = new Set();
  trains.forEach(t => {
    seen.add(t.id);
    let el = trainElements.get(t.id);
    if (!el) {
      el = document.createElementNS("http://www.w3.org/2000/svg", "circle");
      el.setAttribute("r", 0.35);
      el.setAttribute("class", "train");
      svg.appendChild(el);
      trainElements.set(t.id, el);
    }
    el.setAttribute("cx", t.x);
    el.setAttribute("cy", t.y);
    const title = el.querySelector("title") || document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = `${t.mission || t.id}: ${t.from} -> ${t.to}`;
    el.appendChild(title);
  });

  for (const [id, el] of trainElements.entries()) {
    if (!seen.has(id)) { el.remove(); trainElements.delete(id); }
  }
}

async function refreshPositions(svg) {
  try {
    const res = await fetch("positions.json", { cache: "no-store" });
    const data = await res.json();
    updateTrains(svg, data.trains || []);
  } catch (e) {
    console.error("Erreur de chargement des positions:", e);
  }
}

async function main() {
  const svg = document.getElementById("map");
  const schema = await loadSchema();
  drawSchema(svg, schema);
  await refreshPositions(svg);
  setInterval(() => refreshPositions(svg), 15000);
}

main();
</script>
</body>
</html>
