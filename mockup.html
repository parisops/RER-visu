<script>
const panel = document.getElementById('info-panel');
document.querySelectorAll('.station').forEach(el => {
  el.addEventListener('click', () => {
    document.querySelectorAll('.station.selected').forEach(s => s.classList.remove('selected'));
    el.classList.add('selected');
    const name = el.getAttribute('data-name');
    const id = el.getAttribute('data-id');
    panel.textContent = `Gare s\u00e9lectionn\u00e9e : ${name} (id: ${id})`;
    panel.classList.add('open');
    console.log('station click', id, name, el.dataset.x, el.dataset.y);
  });
});

function placeTrain(x, y, id) {
  const svg = document.getElementById('map');
  let el = document.getElementById('train-' + id);
  if (!el) {
    el = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    el.setAttribute('id', 'train-' + id);
    el.setAttribute('r', 6);
    el.setAttribute('class', 'train');
    svg.appendChild(el);
  }
  el.setAttribute('cx', x);
  el.setAttribute('cy', y);
}
</script>
