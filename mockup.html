<!DOCTYPE html>
<html lang="fr">

<meta charset="UTF-8">
<title>RER C - Mock-up style Mini Metro</title>
<style>
  * { box-sizing: border-box; }
  body {
    background: #f2eee2;
    margin: 0;
    font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    color: #2b2b2b;
  }
  header {
    position: sticky; top: 0; z-index: 20;
    background: #f2eee2;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px 10px;
  }
  .logo-c {
    width: 34px; height: 34px; border-radius: 50%;
    background: #e0a92e; color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; flex-shrink: 0;
  }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; letter-spacing: 0.3px; }
  header p { margin: 0; font-size: 10.5px; color: #6b6b63; }

  .wrap { display: flex; justify-content: center; padding: 10px 10px 90px; }

  .track { stroke: #e0a92e; stroke-width: 9; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .spur-line { stroke-dasharray: 3 10; stroke-width: 5; opacity: 0.55; }
  .station-dot { fill: #f2eee2; stroke: #2b2b2b; stroke-width: 2.5; }
  .station-hub { fill: #f2eee2; stroke: #2b2b2b; stroke-width: 3; }
  .spur-dot { fill: #6b6b63; stroke: none; }
  .hub-label { fill: #2b2b2b; font-size: 12.5px; font-weight: 600; }
  .lane-title { fill: #6b6b63; font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; }
  .fork-title { fill: #6b6b63; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; }
  .spur-label { fill: #6b6b63; font-size: 10.5px; font-style: italic; }

  .train-body { fill: #e0a92e; stroke: #2b2b2b; stroke-width: 1.8; }

  footer {
    text-align: center; font-size: 10px; color: #6b6b63;
    padding: 18px; border-top: 1px solid #ddd8c8;
  }
</style>
</head>
