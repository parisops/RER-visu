name: Update live departures (RER C)

# Interroge l'API PRIM (SIRI Lite StopMonitoring) pour les 75 gares et commit
# data/live-departures.json, consommé par js/real-schedule.js dans le navigateur.
#
# Prérequis : un secret de repo PRIM_API_KEY (Settings > Secrets and variables
# > Actions > New repository secret). Ne jamais mettre la clé ailleurs.

on:
  # Quota officiel de l'API "Prochains passages - requête unitaire" : 20 000
  # requêtes / jour. Avec 75 gares interrogées à chaque run, 1 run toutes les
  # 10 min = 144 runs/jour x 75 = 10 800 requêtes/jour (confortable, laisse de
  # la marge pour des déclenchements manuels). Vous pouvez descendre à 5 min
  # (288 x 75 = 21 600/jour) mais c'est déjà au-dessus du quota — à ne faire
  # que si vous avez vérifié que votre quota réel est plus élevé.
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}     # permet aussi un déclenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch PRIM StopMonitoring for all stations
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: python3 tools/fetch_prim_departures.py

      - name: Commit updated data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-departures.json
          git diff --staged --quiet || git commit -m "chore: update live departures [skip ci]"
          git push
