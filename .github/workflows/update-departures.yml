name: Update live departures (RER C)

# Interroge l'API PRIM (SIRI Lite StopMonitoring) pour les 75 gares, ecrit
# data/live-departures.json (consomme par js/real-schedule.js), puis derive
# data/live-trains.json (positions interpolees des trains en circulation,
# consomme par js/trains.js pour le suivi des trains) en s'appuyant sur un
# historique persiste (data/train-tracks.json) qui accumule les arrets
# observes d'un train au fil des runs successifs.
#
# Prerequis : un secret de repo PRIM_API_KEY (Settings > Secrets and variables
# > Actions > New repository secret). Ne jamais mettre la cle ailleurs.
#
# Cadence adaptee au service RER C (heure de Paris, gere automatiquement les
# changements d'heure ete/hiver car calculee via TZ=Europe/Paris dans le job,
# et non via le cron GitHub qui lui est toujours en UTC) :
#   - Hors service (1h-5h du matin)            : aucun appel API
#   - Heures de pointe 7h-9h30 et 16h30-19h30   : 1 appel toutes les 5 min
#   - Reste du service (5h-7h, 9h30-16h30,
#     19h30-1h)                                 : 1 appel toutes les 10 min
#
# Le workflow se declenche toutes les 5 min (cron GitHub, cout minime car le
# job s'arrete immediatement hors fenetre), mais n'appelle l'API PRIM que
# lorsque la fenetre de service/pointe le justifie.
#
# Le cron est decale sur des minutes non-rondes (:02, :07, :12...) plutot que
# */5 pile (:00, :05, :10...). GitHub documente explicitement que le
# declencheur schedule peut etre retarde pendant les periodes de forte charge,
# notamment en debut d'heure et sur les minutes rondes ou des millions de
# workflows dans le monde se declenchent simultanement. Ce decalage reduit la
# contention sans changer le nombre de runs/jour ni le budget quota.
#
# IMPORTANT : les schedules GitHub Actions restent "best effort" (aucune
# garantie de precision a la minute, des retards ponctuels meme apres ce
# decalage restent possibles). Cote front-end, js/trains.js interpole la
# position des trains en continu a partir des heures PRIM reelles sur TOUTE
# la mission connue (pas seulement le prochain arret), donc un run legerement
# retarde n'immobilise pas les trains a l'ecran.
#
# Budget quotidien estime (quota officiel "Prochains passages - requete
# unitaire" : 20 000 requetes/jour, 75 gares interrogees par run) :
#   - Jour avec pointe (330 min a 5 min => 66 runs, 870 min a 10 min => 87 runs)
#     => (66 + 87) x 75 = 11 475 requetes/jour
#   - Week-end / jour sans distinction de pointe (~1200 min de service a 10 min
#     => 120 runs) => 120 x 75 = 9 000 requetes/jour
# Marge confortable sous les 20 000/jour dans tous les cas.
# build_live_trains.py ne fait aucun appel reseau (il derive uniquement
# live-departures.json + son propre historique) : il n'a aucun impact sur ce
# budget.

on:
  schedule:
    - cron: '2-59/5 * * * *'
  workflow_dispatch: {}     # permet aussi un declenchement manuel depuis l'onglet Actions

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine if this run should call PRIM (service hours + peak optimisation)
        id: window
        run: |
          export TZ='Europe/Paris'
          hour=$(date +%H)
          minute=$(date +%M)
          hour10=$((10#$hour))
          minute10=$((10#$minute))
          now_min=$((hour10 * 60 + minute10))

          # Hors service RER C (01h00 a 04h59) : on ne fait rien
          if [ "$hour10" -ge 1 ] && [ "$hour10" -le 4 ]; then
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Hors service (${hour}h${minute}) - run ignore"
            exit 0
          fi

          # Heures de pointe : 7h00-9h30 et 16h30-19h30 -> cadence 5 min (= chaque declenchement)
          peak_am_start=$((7 * 60))
          peak_am_end=$((9 * 60 + 30))
          peak_pm_start=$((16 * 60 + 30))
          peak_pm_end=$((19 * 60 + 30))

          if { [ "$now_min" -ge "$peak_am_start" ] && [ "$now_min" -lt "$peak_am_end" ]; } || \
             { [ "$now_min" -ge "$peak_pm_start" ] && [ "$now_min" -lt "$peak_pm_end" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Heure de pointe (${hour}h${minute}) - run retenu (cadence 5 min)"
            exit 0
          fi

          # Reste du service : cadence ~10 min (un declenchement sur deux, arrondi a la minute du cron)
          if [ $((minute10 % 10)) -le 2 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Heure creuse en service (${hour}h${minute}) - run retenu (cadence ~10 min)"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Heure creuse en service (${hour}h${minute}) - run ignore (cadence ~10 min)"
          fi

      - uses: actions/setup-python@v5
        if: steps.window.outputs.should_run == 'true'
        with:
          python-version: '3.12'

      - name: Fetch PRIM StopMonitoring for all stations
        if: steps.window.outputs.should_run == 'true'
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
        run: python3 tools/fetch_prim_departures.py

      - name: Build live train positions (suivi des trains)
        if: steps.window.outputs.should_run == 'true'
        run: python3 tools/build_live_trains.py

      - name: Commit updated data if changed
        if: steps.window.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live-departures.json data/live-trains.json data/train-tracks.json
          git diff --staged --quiet || git commit -m "chore: update live departures and train positions [skip ci]"
          git push
